services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudmeter-postgres
    environment:
      POSTGRES_USER: cloudmeter
      POSTGRES_PASSWORD: cloudmeter
      POSTGRES_DB: cloudmeter
    ports:
      - "55432:5432"
    volumes:
      - cloudmeter-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudmeter -d cloudmeter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cloudmeter-postgres:
